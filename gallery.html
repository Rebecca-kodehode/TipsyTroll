<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <link rel="stylesheet" href="links.css" />
  </head>
  <body>
    <section class="photo-gallery">
      <img
        src="images/dragon-bbq.webp"
        alt="Dragon BBQ"
        class="featured-photo"
      />
      <img src="images/ghost-drink.png" alt="Ghost drink" class="photo-item" />

      <img
        src="images/featured-brew.webp"
        alt="Featured Brew"
        class="photo-item"
      />
      <img src="images/happy-hour.webp" alt="Happy Hour" class="photo-item" />
      <img
        src="images/potion-mixing.webp"
        alt="Potion Mixing"
        class="photo-item"
      />
      <img src="images/wizard-duel.webp" alt="Wizard Duel" class="photo-item" />
    </section>
  </body>
</html>
